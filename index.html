    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">

        <div class="text-center mb-8">

            <p class="text-sm text-slate-500 mt-1">Management Flotă • Acces Securizat</p>

        <!-- Pasul 1: Formularul de Autentificare -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Adresă Gmail</label>
                <input type="email" id="email" required 
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none"
                    placeholder="nume@gmail.com">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Parolă</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:outline-none"
                    placeholder="••••••••">
            </div>

            <button type="submit" 
                class="w-full bg-slate-900 text-white py-3 rounded-lg font-medium hover:bg-slate-800 transition shadow-sm">
                Continuă (Trimite cod 2FA)
            </button>
        </form>
